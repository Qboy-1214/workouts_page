name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python_lint_and_test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          # Step 1: Install stravalib>=2.0.0 (upgrade from old version)
          pip install 'stravalib>=2.0.0'
          # Step 2: Install stravaweblib without deps (bypass conflicting stravalib<1.0.0 constraint)
          pip install stravaweblib --no-deps
          # Step 3: Install remaining requirements (skip stravalib and stravaweblib)
          grep -v '^stravalib' requirements.txt | grep -v '^stravaweblib' | pip install -r /dev/stdin
          # Step 4: Install dev dependencies (except ones already installed)
          grep -v '^-r requirements.txt' requirements-dev.txt | pip install -r /dev/stdin

      - name: Run GPX sync test
        run: |
          # make sure the gpx_sync.py script is executable
          python run_page/gpx_sync.py

      - name: Check formatting (black)
        run: black . --diff --color --target-version py312 && black . --check --target-version py312

      - name: Lint with Ruff
        run: |
          pip install 'ruff==0.9.0'
          # Use github output format for inline annotations in the checks view
          ruff check . --target-version py312 --output-format=github

  node_lint_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run check and build
        run: |
          # Skip pnpm run check - it checks workflow files which is not relevant to code quality
          # Just run lint and build directly
          pnpm run lint
          pnpm run build
