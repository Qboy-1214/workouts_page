name: Garmin COM to CN Mirror

# Garmin throttles a second fresh COM credential login within ~15-60 min, and
# garminconnect's token resume is broken upstream (deprecated garth backend).
# So this mirror runs on its own schedule, offset from Run Data Sync, and does
# exactly ONE fresh COM login per run.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3,15 * * *'

env:
  USE_CLOUDFLARE_WARP: true # GitHub runner IPs get Cloudflare bot challenges from Garmin SSO
  SAVE_DATA_IN_GITHUB_CACHE: false
  DATA_CACHE_PREFIX: 'track_data'
  BUILD_GH_PAGES: true

jobs:
  mirror:
    name: Mirror Garmin COM to CN
    runs-on: ubuntu-latest
    env:
      GARMIN_COM_USERNAME: ${{ secrets.GARMIN_COM_USERNAME }}
      GARMIN_COM_PASSWORD: ${{ secrets.GARMIN_COM_PASSWORD }}
      GARMIN_CN_USERNAME: ${{ secrets.GARMIN_CN_USERNAME }}
      GARMIN_CN_PASSWORD: ${{ secrets.GARMIN_CN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          # Step 1: Install stravalib>=2.0.0 (upgrade from old version)
          pip install 'stravalib>=2.0.0'
          # Step 2: Install stravaweblib without deps (bypass conflicting stravalib<1.0.0 constraint)
          pip install stravaweblib --no-deps
          # Step 3: Install remaining requirements (skip stravalib and stravaweblib)
          grep -v '^stravalib' requirements.txt | grep -v '^stravaweblib' | pip install -r /dev/stdin

      - name: Install Cloudflare WARP
        if: env.USE_CLOUDFLARE_WARP == 'true'
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

      - name: Connect Cloudflare WARP
        if: env.USE_CLOUDFLARE_WARP == 'true'
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 3
          echo "WARP status:"
          warp-cli --accept-tos status
          echo "IP info:"
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E "ip|warp"

      - name: Restore Garmin login tokens
        id: token_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.garminconnect
            ~/.garth
          key: garmin-tokens-mirror-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-mirror-

      - name: Run sync Garmin COM to Garmin CN script
        run: |
          python run_page/garmin_sync_global_cn.py
        # Syncs from Garmin International (COM) to Garmin China (CN)
        # Uses GARMIN_CN_USERNAME, GARMIN_CN_PASSWORD, GARMIN_COM_USERNAME, GARMIN_COM_PASSWORD environment variables
        # If you only want to sync 'type running' add args --only-run

      - name: Save Garmin login tokens
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.garminconnect
            ~/.garth
          key: garmin-tokens-mirror-${{ github.run_id }}

      - name: Push new runs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m 'Add new workouts (COM->CN mirror)' || echo 'nothing to commit'
          git push || echo 'nothing to push'

  publish_github_pages:
    if: needs.mirror.result == 'success'
    name: Build and publish Github Pages
    uses: ./.github/workflows/gh-pages.yml
    with:
      save_data_in_github_cache: false
      data_cache_prefix: 'track_data'
    needs:
      - mirror
